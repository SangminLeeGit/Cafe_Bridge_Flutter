name: cafe_bridge_flutter
description: A new Flutter project for Cafe Bridge analytics.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.1.0+35

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # flutter_localizations references the framework Cupertino delegate.
  cupertino_icons: ^1.0.2
  provider: ^6.1.1
  http: ^1.2.0
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.0.0
  package_info_plus: ^8.0.2
  path_provider: ^2.1.4
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/cafe_bridge_logo.png
