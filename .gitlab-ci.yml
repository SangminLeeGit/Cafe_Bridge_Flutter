stages:
  - build

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'

variables:
  DEPLOY_TASK_ID:
    value: ""
    description: "Optional server-side deployment task ID."
  REQUESTED_BY:
    value: ""
    description: "Optional requesting user; defaults to the commit author."
  REASON:
    value: ""
    description: "Optional release notes; defaults to the commit subject."
  DRY_RUN:
    value: "false"
    options: ["false", "true"]
    description: "Build without registering the APK in the application server."

android_release_apk:
  stage: build
  tags: [central-android-release]
  resource_group: cafe-bridge-android-release
  timeout: 30 minutes
  interruptible: false
  script:
    - ./.gitlab/ci/android-release.sh
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - build/app/outputs/flutter-apk/app-release.apk
  after_script:
    - if command -v gradle >/dev/null 2>&1; then gradle --stop || true; fi
    - pkill -u "$(id -u)" -f 'KotlinCompileDaemon' || true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE =~ /^(api|trigger|web)$/'
