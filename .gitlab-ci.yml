stages:
  - security
  - validate
  - release

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH =~ /^release\/.+$/'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG'
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE =~ /^(api|trigger|web)$/'

variables:
  GIT_DEPTH: "0"
  PUB_CACHE: "/var/cache/android-builder/pub"
  GRADLE_USER_HOME: "/var/cache/android-builder/gradle"
  RUNNER_SCRIPT_TIMEOUT: "50m"
  RUNNER_AFTER_SCRIPT_TIMEOUT: "5m"
  DEPLOY_TASK_ID:
    value: ""
    description: "Optional server-side deployment task ID."
  REQUESTED_BY:
    value: ""
    description: "Optional requesting user; defaults to the commit author."
  REASON:
    value: ""
    description: "Optional release notes; defaults to the commit subject."
  DRY_RUN:
    value: "false"
    options: ["false", "true"]
    description: "Build without registering the APK in the application server."

android_validate:
  stage: validate
  tags: [cafe-bridge-android-release]
  timeout: 20 minutes
  interruptible: true
  retry: 1
  script:
    - ./.gitlab/ci/android-validate.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH =~ /^release\/.+$/'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG'
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE =~ /^(api|trigger|web)$/'

secret_detection:
  stage: security
  tags: [cafe-bridge-android-release]
  timeout: 10 minutes
  interruptible: true
  retry: 1
  before_script:
    - export PATH="/opt/android-builder/security-tools/bin:$PATH"
    - test "$(gitleaks version)" = "8.24.2"
  script:
    - gitleaks git --redact --no-banner --verbose

sast:
  stage: security
  tags: [cafe-bridge-android-release]
  timeout: 20 minutes
  interruptible: true
  retry: 1
  before_script:
    - test "$(/opt/android-builder/security-tools/venv/bin/semgrep --version)" = "1.171.0"
  script:
    - /opt/android-builder/security-tools/venv/bin/semgrep scan --config p/default --error --metrics=off .

ci_failure_report:
  stage: .post
  tags: [cafe-bridge-android-release]
  timeout: 5 minutes
  when: on_failure
  allow_failure: true
  script:
    - ./.gitlab/ci/report-failure.sh
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE =~ /^(push|api|trigger|web)$/'

android_release_apk:
  extends: .android_release_template
  environment:
    name: production
  rules:
    - if: '$DRY_RUN != "true" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE =~ /^(api|trigger)$/'
    - if: '$DRY_RUN != "true" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: false
    - if: '$DRY_RUN != "true" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$DRY_RUN != "true" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^release\/.+$/'
    - if: '$DRY_RUN != "true" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG'

android_release_dry_run:
  extends: .android_release_template
  environment:
    name: staging
  rules:
    - if: '$DRY_RUN == "true" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE =~ /^(push|api|trigger|web)$/'

.android_release_template:
  stage: release
  tags: [cafe-bridge-android-release]
  needs: [android_validate]
  resource_group: cafe-bridge-android-release
  timeout: 60 minutes
  interruptible: false
  script:
    - ./.gitlab/ci/android-release.sh
  artifacts:
    when: on_success
    expire_in: 7 days
    paths:
      - build/app/outputs/flutter-apk/app-release.apk
  after_script:
    - if command -v gradle >/dev/null 2>&1; then gradle --stop || true; fi
    - pkill -u "$(id -u)" -f 'KotlinCompileDaemon' || true
