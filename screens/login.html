<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cafe Bridge · 로그인</title><link rel="stylesheet" href="../screen-system.css"></head>
<body>
  <main class="login-screen" data-od-id="login-screen">
    <section class="login-card" data-od-id="login-card">
      <div class="login-brand" data-od-id="login-brand">
        <img src="../assets/cafe_bridge_logo.png" alt="Cafe Bridge">
        <div><p class="eyebrow">Cafe Bridge</p><h1 class="login-title">운영 콘솔 로그인</h1><p class="login-subtitle">카페 운영과 매출 분석을 한 곳에서 관리합니다.</p></div>
      </div>
      <div class="notice info" style="margin-top:20px" data-od-id="offline-notice">저장된 세션과 캐시로 오프라인 모드가 유지되고 있습니다.</div>
      <div class="notice warning" style="margin-top:12px" data-od-id="setup-notice">초기 관리자 계정이 아직 준비되지 않았습니다. 서버 설정을 먼저 확인해야 합니다.</div>
      <form id="login-form" style="margin-top:16px" data-od-id="login-form">
        <div class="field"><label for="login-id">아이디</label><input id="login-id" autocomplete="username" placeholder="아이디"></div>
        <div class="field"><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" placeholder="비밀번호"></div>
        <label class="check-row"><input id="remember-me" type="checkbox"> 로그인 상태 유지</label>
        <div class="notice error" id="login-error" hidden data-od-id="login-error">아이디 또는 비밀번호가 올바르지 않습니다.</div>
        <div class="form-actions"><button class="button" id="submit-button" type="submit" data-od-id="login-submit">로그인</button></div>
      </form>
      <p class="screen-footer" style="padding:18px 0 0">POST <span class="code-value">/api/auth/login</span> · session cookie + CSRF</p>
    </section>
  </main>
  <script>
    const form = document.querySelector('#login-form'); const button = document.querySelector('#submit-button'); const error = document.querySelector('#login-error');
    form.addEventListener('submit', (event) => { event.preventDefault(); error.hidden = true; button.setAttribute('aria-disabled','true'); button.textContent = '로그인 중...'; setTimeout(() => { button.removeAttribute('aria-disabled'); button.textContent = '로그인'; error.hidden = false; }, 900); });
  </script>
</body>
</html>
