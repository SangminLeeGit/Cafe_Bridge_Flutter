plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def releaseKeystorePath = System.getenv("CAFE_BRIDGE_ANDROID_KEYSTORE_PATH") ?: ""
def releaseKeyAlias = System.getenv("CAFE_BRIDGE_ANDROID_KEY_ALIAS") ?: ""
def releaseStorePassword = System.getenv("CAFE_BRIDGE_ANDROID_STORE_PASSWORD") ?: ""
def releaseKeyPassword = System.getenv("CAFE_BRIDGE_ANDROID_KEY_PASSWORD") ?: ""
def releaseSigningConfigured = [
    releaseKeystorePath,
    releaseKeyAlias,
    releaseStorePassword,
    releaseKeyPassword,
].every { !it.trim().isEmpty() }
def releaseTaskRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains("release")
}

android {
    namespace = "org.cafe.bridge.mobile"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "org.cafe.bridge.mobile"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile = file(releaseKeystorePath)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (!releaseSigningConfigured && releaseTaskRequested) {
                throw new GradleException("Cafe Bridge Android release signing variables are required")
            }
            signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}
