plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def releaseKeystorePath = System.getenv("CAFE_BRIDGE_ANDROID_KEYSTORE_PATH") ?: ""
def releaseKeyAlias = System.getenv("CAFE_BRIDGE_ANDROID_KEY_ALIAS") ?: ""
def releaseStorePassword = System.getenv("CAFE_BRIDGE_ANDROID_STORE_PASSWORD") ?: ""
def releaseKeyPassword = System.getenv("CAFE_BRIDGE_ANDROID_KEY_PASSWORD") ?: ""
def releaseSigningConfigured = [
    releaseKeystorePath,
    releaseKeyAlias,
    releaseStorePassword,
    releaseKeyPassword,
].every { !it.trim().isEmpty() }
def releaseSigningPartiallyConfigured = [
    releaseKeystorePath,
    releaseKeyAlias,
    releaseStorePassword,
    releaseKeyPassword,
].any { !it.trim().isEmpty() } && !releaseSigningConfigured
def releaseTaskRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains("release")
}

android {
    namespace = "org.cafe.bridge.mobile"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "org.cafe.bridge.mobile"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile = file(releaseKeystorePath)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (releaseTaskRequested && !releaseSigningConfigured) {
                def detail = releaseSigningPartiallyConfigured ? "all four must be set" : "none are set"
                throw new GradleException("Cafe Bridge Android release signing variables are required (${detail})")
            }
            if (releaseTaskRequested && !file(releaseKeystorePath).isFile()) {
                throw new GradleException("Cafe Bridge Android release keystore does not exist: ${releaseKeystorePath}")
            }
            signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}

gradle.taskGraph.whenReady { graph ->
    def includesReleaseVariant = graph.allTasks.any {
        it.project == project && it.name.toLowerCase().contains("release")
    }
    if (includesReleaseVariant && !releaseSigningConfigured) {
        def detail = releaseSigningPartiallyConfigured ? "all four must be set" : "none are set"
        throw new GradleException("Cafe Bridge Android release signing variables are required (${detail})")
    }
    if (includesReleaseVariant && !file(releaseKeystorePath).isFile()) {
        throw new GradleException("Cafe Bridge Android release keystore does not exist: ${releaseKeystorePath}")
    }
}
